# The backend on Vercel has no background worker, and Vercel Hobby only allows daily crons.
# This workflow calls the reminder endpoint every 5 minutes so students get the "starts in 30 minutes" push.
# (GitHub may delay scheduled runs by a few minutes under load; cron-job.org is an alternative.)
#
# Repository settings: Variable API_URL (backend URL), Secret CRON_SECRET (same value as on Vercel).
name: Session reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/v1/cron/reminders
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL variable or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$API_URL/api/v1/cron/reminders"
