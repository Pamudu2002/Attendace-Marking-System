services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    command: ["pnpm", "--filter", "@attendance/backend", "start"]
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://attendance:attendance@postgres:5432/attendance
    ports: ["3000:3000"]
    depends_on: [postgres]

  worker:
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    command: ["pnpm", "--filter", "@attendance/backend", "worker"]
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://attendance:attendance@postgres:5432/attendance
    depends_on: [postgres]

volumes:
  pgdata:
